<script>
(()=>{
'use strict';
/* ================= CONSTANTS ================= */
const W=1920,H=1080,FPS=30,BPM=72,BPS=BPM/60,TAU=Math.PI*2,PI=Math.PI;
const DX=860,DY=585; // diagram centre
const DEV='"Noto Sans Devanagari","Mangal","Kohinoor Devanagari","Nirmala UI"';
const MONO='ui-monospace,"SF Mono","Cascadia Mono",Consolas,Menlo,"Liberation Mono","DejaVu Sans Mono",'+DEV+',monospace';
const DISP=DEV+',sans-serif';
const FM=(s,w)=>(w||500)+' '+s+'px '+MONO;
const FD=(s,w)=>(w||700)+' '+s+'px '+DISP;
const stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});

/* ================= MATH / DETERMINISTIC RANDOM ================= */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,u)=>a+(b-a)*u;
const inv=(a,b,x)=>clamp((x-a)/(b-a));
const eIO=u=>{u=clamp(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
const eOX=u=>{u=clamp(u);return u>=1?1:1-Math.pow(2,-10*u);};
const eOC=u=>{u=clamp(u);return 1-Math.pow(1-u,3);};
const eIC=u=>{u=clamp(u);return u*u*u;};
const fr=x=>x-Math.floor(x);
const tick=(b,f=.42)=>{const i=Math.floor(b);return i+eIO((b-i)/f);}; // beat-locked stepped motion
const pad=(n,l=2)=>String(Math.max(0,Math.floor(n))).padStart(l,'0');
const angD=(a,b)=>{let d=((a-b)%TAU+TAU)%TAU;return d>PI?TAU-d:d;};
function hash(i,s){let h=Math.imul((i|0)^0x9e3779b9,0x85ebca6b)^Math.imul(((s|0)+0x632be5ab)|0,0xc2b2ae35);h^=h>>>16;h=Math.imul(h,0x7feb352d);h^=h>>>15;h=Math.imul(h,0x846ca68b);h^=h>>>16;return (h>>>0)/4294967296;}
function rng(seed){return function(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}

/* ================= COLOUR ================= */
const ca=a=>(a!==a||a<=0)?0:a>=1?1:Math.round(a*1000)/1000;
const G=a=>'rgba(212,162,76,'+ca(a)+')';   // molten gold
const GH=a=>'rgba(247,212,140,'+ca(a)+')'; // hot gold
const V=a=>'rgba(226,69,43,'+ca(a)+')';    // sindoor vermilion
const A=a=>'rgba(232,220,196,'+ca(a)+')';  // ash white
const K=a=>'rgba(11,8,6,'+ca(a)+')';       // bronze black

/* ================= TEXT / SHAPE HELPERS ================= */
let curFrame=0;
function T(s,x,y,font,fill,al,bl,sp){ctx.font=font;ctx.fillStyle=fill;ctx.textAlign=al||'left';ctx.textBaseline=bl||'alphabetic';ctx.letterSpacing=(sp||0)+'px';ctx.fillText(s,x,y);}
function MW(s,font,sp){ctx.font=font;ctx.letterSpacing=(sp||0)+'px';return ctx.measureText(s).width;}
const WRAPC=new Map();
function wrap(s,font,mw){const key=font+'|'+mw+'|'+s;let r=WRAPC.get(key);if(r)return r;ctx.font=font;ctx.letterSpacing='0px';r=[];let line='';for(const w of s.split(' ')){const tst=line?line+' '+w:w;if(ctx.measureText(tst).width>mw&&line){r.push(line);line=w;}else line=tst;}if(line)r.push(line);WRAPC.set(key,r);return r;}
const isMark=c=>(c>=0x0900&&c<=0x0903)||(c>=0x093A&&c<=0x094F)||(c>=0x0951&&c<=0x0957)||(c>=0x0962&&c<=0x0963);
function tslice(s,n){if(n>=s.length)return s;if(n<=0)return '';while(n<s.length&&(isMark(s.charCodeAt(n))||s.charCodeAt(n-1)===0x094D))n++;return s.slice(0,n);}
const GL='#%&@$*+=/<>ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
function scr(s,u,seed){if(u>=1)return s;const n=Math.floor(s.length*u);let o=s.slice(0,n);for(let i=n;i<s.length;i++){const c=s[i];o+=(c===' '||c==='·')?c:GL[Math.floor(hash(i+curFrame*7,seed)*GL.length)];}return o;}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);}
function diamond(x,y,s){ctx.moveTo(x,y-s);ctx.lineTo(x+s*.8,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s*.8,y);ctx.closePath();}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function backdrop(x,y,r,a){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,K(a));g.addColorStop(.6,K(a*.7));g.addColorStop(1,K(0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}

/* ================= PRE-RENDERED ASSETS (seeded) ================= */
function spriteOf(c0,c1){const c=mk(64,64),g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,c0);gr.addColorStop(.35,c1);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return c;}
const SOFT=spriteOf('rgba(255,236,190,1)','rgba(212,162,76,.45)');
const SOFTV=spriteOf('rgba(255,170,140,1)','rgba(226,69,43,.45)');
function glow(x,y,r,a,spr){if(a<=0||r<=0)return;ctx.save();ctx.globalAlpha=clamp(a);ctx.globalCompositeOperation='lighter';ctx.drawImage(spr||SOFT,x-r,y-r,r*2,r*2);ctx.restore();}
const MAND=(()=>{const S=1060,c=mk(S,S),g=c.getContext('2d');g.translate(S/2,S/2);g.strokeStyle='#d4a24c';g.fillStyle='#d4a24c';g.lineWidth=1;
  [70,130,190,250,310,370,430,490].forEach((r,i)=>{g.globalAlpha=i%2?.35:.6;g.beginPath();g.arc(0,0,r,0,TAU);g.stroke();});
  g.globalAlpha=.55;for(let i=0;i<180;i++){const a=i/180*TAU,l=i%15===0?18:i%5===0?10:4;g.beginPath();g.moveTo(Math.cos(a)*(490-l),Math.sin(a)*(490-l));g.lineTo(Math.cos(a)*490,Math.sin(a)*490);g.stroke();}
  g.globalAlpha=.22;g.setLineDash([2,7]);for(let i=0;i<24;i++){const a=i/24*TAU;g.beginPath();g.moveTo(Math.cos(a)*70,Math.sin(a)*70);g.lineTo(Math.cos(a)*430,Math.sin(a)*430);g.stroke();}g.setLineDash([]);
  g.globalAlpha=.4;for(let i=0;i<16;i++){const a=i/16*TAU,d=TAU/32;for(const [q,e] of [[1,395],[.5,360]]){g.beginPath();g.moveTo(Math.cos(a-d*q)*310,Math.sin(a-d*q)*310);g.quadraticCurveTo(Math.cos(a)*e,Math.sin(a)*e,Math.cos(a+d*q)*310,Math.sin(a+d*q)*310);g.stroke();}}
  g.globalAlpha=.5;g.font='500 11px '+MONO;g.textAlign='center';g.textBaseline='middle';for(let i=0;i<12;i++){g.save();g.rotate(i/12*TAU);g.fillText(String(i*30).padStart(3,'0'),0,-508);g.restore();}
  return c;})();
const ROSE=(()=>{const S=440,c=mk(S,S),g=c.getContext('2d');g.translate(S/2,S/2);g.strokeStyle='#d4a24c';g.fillStyle='#d4a24c';g.lineWidth=1.2;
  g.globalAlpha=.55;g.beginPath();for(let i=0;i<32;i++){const a=i/32*TAU-PI/2,r=i%8===0?190:i%4===0?130:i%2===0?95:60;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();g.stroke();
  g.globalAlpha=.16;for(let i=0;i<8;i++){const a=i/8*TAU-PI/2,r=i%2?130:190;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*r,Math.sin(a)*r);g.lineTo(Math.cos(a+TAU/32)*95,Math.sin(a+TAU/32)*95);g.closePath();g.fill();}
  g.globalAlpha=.45;[26,60,150].forEach(r=>{g.beginPath();g.arc(0,0,r,0,TAU);g.stroke();});
  g.globalAlpha=.85;g.font='700 20px '+DISP;g.textAlign='center';g.textBaseline='middle';[['उ',-PI/2],['पू',0],['द',PI/2],['प',PI]].forEach(([s,a])=>g.fillText(s,Math.cos(a)*208,Math.sin(a)*208));
  return c;})();
const NOISE=(()=>{const out=[],r=rng(1337);for(let k=0;k<4;k++){const c=mk(1024,576),g=c.getContext('2d'),im=g.createImageData(1024,576);for(let i=0;i<im.data.length;i+=4){const v=r()*255|0;im.data[i]=v;im.data[i+1]=v*.88|0;im.data[i+2]=v*.72|0;im.data[i+3]=r()*22|0;}g.putImageData(im,0,0);out.push(c);}return out;})();
const OVER=(()=>{const c=mk(W,H),g=c.getContext('2d');
  const sc=mk(4,4),sg=sc.getContext('2d');sg.fillStyle='rgba(0,0,0,.26)';sg.fillRect(0,0,4,1);sg.fillStyle='rgba(255,220,160,.022)';sg.fillRect(0,2,4,1);
  g.fillStyle=g.createPattern(sc,'repeat');g.fillRect(0,0,W,H);
  const gr=g.createRadialGradient(W/2,H/2,H*.36,W/2,H/2,H*1.05);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.74)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  return c;})();
const MC=mk(1100,1100),MCX=MC.getContext('2d');let mcKey=null;

/* Giant bloom title: layered shadowBlur, vermilion haze -> gold -> vermilion edge -> gold core */
function bloom(s,x,y,size,a,hot){
  if(a<=.003)return;
  ctx.save();ctx.font=FD(size,700);ctx.textAlign='center';ctx.textBaseline='middle';ctx.letterSpacing='0px';ctx.globalAlpha=clamp(a);
  ctx.shadowColor=V(.95);ctx.shadowBlur=size*.5;ctx.fillStyle=V(.5);ctx.fillText(s,x,y);
  ctx.shadowColor=hot?V(1):G(1);ctx.shadowBlur=size*.2;ctx.fillStyle=hot?V(.9):G(.85);ctx.fillText(s,x,y);
  ctx.shadowBlur=0;ctx.lineJoin='round';ctx.lineWidth=Math.max(1.5,size*.035);ctx.strokeStyle=V(.95);ctx.strokeText(s,x,y);
  const gr=ctx.createLinearGradient(0,y-size*.55,0,y+size*.45);
  if(hot){gr.addColorStop(0,'#ffd7c8');gr.addColorStop(.55,'#f0603c');gr.addColorStop(1,'#b3281a');}
  else{gr.addColorStop(0,'#fff1c8');gr.addColorStop(.5,'#f2c56e');gr.addColorStop(1,'#b8802f');}
  ctx.shadowColor=hot?V(1):GH(1);ctx.shadowBlur=size*.05;ctx.fillStyle=gr;ctx.fillText(s,x,y);
  ctx.restore();
}
/* Corner bracket shaped like stepped gopuram tiers */
function gop(x,y,sx,sy,s,col,lw){
  ctx.save();ctx.translate(x,y);ctx.scale(sx,sy);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw||1.6;ctx.lineJoin='miter';ctx.lineCap='butt';
  const u=s/8;ctx.beginPath();
  ctx.moveTo(0,s);ctx.lineTo(0,0);ctx.lineTo(s,0);
  ctx.moveTo(0,s);ctx.lineTo(u*.7,s);ctx.moveTo(s,0);ctx.lineTo(s,u*.7);
  ctx.moveTo(u*1.4,s*.78);ctx.lineTo(u*1.4,u*4.2);ctx.lineTo(u*2.6,u*4.2);ctx.lineTo(u*2.6,u*2.6);ctx.lineTo(u*4.2,u*2.6);ctx.lineTo(u*4.2,u*1.4);ctx.lineTo(s*.78,u*1.4);
  ctx.stroke();
  ctx.beginPath();diamond(u*1.6,u*1.6,u*.55);ctx.fill();
  ctx.restore();
}
function panel(x,y,w,h,a){
  ctx.fillStyle=K(.72*a);ctx.fillRect(x,y,w,h);
  ctx.strokeStyle=G(.26*a);ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);
  const s=22,c=G(.9*a);gop(x,y,1,1,s,c);gop(x+w,y,-1,1,s,c);gop(x,y+h,1,-1,s,c);gop(x+w,y+h,-1,-1,s,c);
}
/* Archimedean spiral: s=0 at the mouth (outer end), s=1 at the centre */
function spiral(cx,cy,R,turns,start,p0,p1,n){ctx.beginPath();const N=n||900,i0=Math.floor(p0*N),i1=Math.floor(p1*N);for(let i=i0;i<=i1;i++){const s=i/N,th=start+s*turns*TAU,r=R*(1-s);const x=cx+r*Math.cos(th),y=cy+r*Math.sin(th);i===i0?ctx.moveTo(x,y):ctx.lineTo(x,y);}}
function spPt(cx,cy,R,turns,start,s){const th=start+s*turns*TAU,r=R*(1-s);return [cx+r*Math.cos(th),cy+r*Math.sin(th),th];}

/* ================= TIMELINE ================= */
const SC=[
 {hi:'चक्रव्यूह',en:'COLD OPEN',dur:12},
 {hi:'द्रोण की रचना',en:"DRONA'S DESIGN",dur:14},
 {hi:'गर्भ में ज्ञान',en:'KNOWLEDGE IN THE WOMB',dur:14},
 {hi:'द्वार पर जयद्रथ',en:'THE GATEKEEPER',dur:13},
 {hi:'प्रवेश',en:'THE ENTRY',dur:15},
 {hi:'सात महारथी',en:'SEVEN AGAINST ONE',dur:14},
 {hi:'रथ का पहिया',en:'THE CHARIOT WHEEL',dur:13},
 {hi:'वीरगति',en:'THE FALL',dur:13},
 {hi:'अर्जुन की प्रतिज्ञा',en:"ARJUNA'S VOW",dur:13},
 {hi:'फिर से',en:'END CARD',dur:9,end:true}
];
let acc=0;SC.forEach((s,i)=>{s.id=i;s.start=acc;acc+=s.dur;});
const DUR=acc,ES=SC[9].start,TOTALF=Math.round(DUR*FPS);
const snapB=x=>Math.round(x*BPS)/BPS; // snap a time to the nagara beat grid
const sceneIndex=t=>{for(let i=SC.length-1;i>0;i--)if(t>=SC[i].start)return i;return 0;};
const CON0=snapB(5.0);
const T3_SEAL=snapB(SC[3].start+4.9);
const T4_B=[];{const b0=Math.ceil((SC[4].start+3.0)*BPS);for(let k=0;k<7;k++)T4_B.push((b0+2*k)/BPS);} // one ring per 2 beats
const T4_CORE=T4_B[6]+.9;
const T5_SNAP=snapB(SC[5].start+11.2);
const T6_CR=[];{const b0=Math.ceil((SC[6].start+6.0)*BPS);for(let k=0;k<8;k++)T6_CR.push((b0+k)/BPS);} // one spoke per beat
const T7_MEM=snapB(SC[7].start+10.2);
const T8_VOW=snapB(SC[8].start+10.8);
const CONCH=[CON0,snapB(SC[1].start+4.6),T3_SEAL,T4_B[6],T8_VOW,snapB(ES+.8)];

/* ================= WAR LOG ================= */
const LOG=[];const L=(si,lt,s,c)=>LOG.push({t:SC[si].start+lt,s,c});
L(0,.8,'SYS · WAR-TABLE ONLINE');
L(0,2.6,'DAY 13 · DRONA COMMANDS THE KAURAVAS');
L(0,4.4,'ARJUNA LURED SOUTH BY THE SAMSHAPTAKAS');
L(0,6.2,'ORDER · FORM THE चक्रव्यूह');

L(1,11.2,'CAN BREAK IT: अर्जुन · कृष्ण · प्रद्युम्न · अभिमन्यु');
L(2,2.8,'FLASHBACK · BEFORE ABHIMANYU WAS BORN');
L(2,4.6,'ARJUNA DESCRIBES THE VYUH TO SUBHADRA');

L(2,10.1,'SUBHADRA ASLEEP · TRANSMISSION CUT','v');

L(3,2.6,'YUDHISHTHIRA · “BREAK IN, WE FOLLOW”');
L(3,4.2,'ABHIMANYU THROUGH THE MOUTH');
L(3,5.1,'JAYADRATHA SEALS THE BREACH','v');
L(3,7.6,'BOON · ALL PANDAVAS HELD BUT ARJUNA');
L(3,10.4,'BHIMA REPULSED · NO FOLLOW-THROUGH','v');
L(4,2.2,'CHARIOT AT FULL GALLOP');
T4_B.forEach((b,k)=>LOG.push({t:b+.05,s:'RING '+(k+1)+' BREACHED · द्वार '+(k+1)}));
LOG.push({t:T4_CORE,s:'CORE REACHED · ALONE'});
L(5,1.8,'SEVEN MAHARATHIS CONVERGE');
L(5,6.4,'DRONA · “CUT HIS BOW FROM BEHIND”');
LOG.push({t:T5_SNAP+.05,s:'KARNA · REAR SHOT · BOW SEVERED',c:'v'});
L(5,12.6,'HORSES, CHARIOTEER, SWORD LOST','v');
L(6,2.4,'LAST WEAPON · A CHARIOT WHEEL');

LOG.push({t:T6_CR[0]+.05,s:'SPOKES FAILING',c:'v'});

L(7,7.6,'SIGNAL FADING');
L(7,10.2,'अभिमन्यु · वीरगति','v');
L(8,2.6,'ARJUNA RETURNS AT DUSK');
L(8,5.0,'VOW · जयद्रथ BEFORE SUNSET, DAY 14');
L(8,7.6,'ELSE · अग्नि-प्रवेश');
LOG.push({t:T8_VOW+.05,s:'देवदत्त · CONCH SOUNDED'});
LOG.sort((a,b)=>a.t-b.t);

/* ================= WARRIOR DOSSIERS ================= */
const WR={
 abhi:{pk:'abhi',id:'KV-13-P16',g:'अ',hi:'अभिमन्यु',en:'ABHIMANYU',role:['अर्जुन-सुभद्रा पुत्र','SON OF ARJUNA & SUBHADRA'],wp:['धनुष · खड्ग','BOW · SWORD'],side:'P',pos:0,st:0,note:'AGE 16 · KNOWS THE WAY IN, NOT THE WAY OUT'},

let rawT=0,playing=false,loop=false,ended=false,lastNow=0,lastKey='',idle=0;
function ui(){bPlay.textContent=playing?'❚❚ PAUSE':'▶ PLAY';bSound.textContent=AU.on?'♪ ON':'♪ OFF';bSound.classList.toggle('on',AU.on);bLoop.textContent=loop?'LOOP ON':'LOOP OFF';bLoop.classList.toggle('on',loop);}
function seek(t){rawT=clamp(t,0,DUR);ended=rawT>=DUR;idle=0;lastKey='';audioStop();AU.sched=rawT;}
function setPlaying(p){if(p&&rawT>=DUR)seek(0);playing=p;ended=false;lastNow=performance.now();audioStop();AU.sched=rawT;ui();}
function frameLoop(now){
  const dt=Math.min(.1,Math.max(0,(now-lastNow)/1000));lastNow=now;
  if(playing){rawT+=dt;if(rawT>=DUR){if(loop){seek(0);}else{rawT=DUR;playing=false;ended=true;idle=0;ui();}}}
  else if(ended)idle+=dt; // end-card chakra keeps turning after the film stops
  audioPump();
  const f=Math.min(TOTALF,Math.floor(rawT*FPS+1e-6)),key=f+'|'+(ended?Math.floor(idle*FPS):0);
  if(key!==lastKey){render(f/FPS,ended?Math.floor(idle*FPS)/FPS:0);lastKey=key;}
  requestAnimationFrame(frameLoop);
}
bPlay.onclick=()=>setPlaying(!playing);
bReplay.onclick=again.onclick=()=>{seek(0);setPlaying(true);};
bSound.onclick=()=>{audioInit();if(!AU.ctx)return;if(AU.ctx.state==='suspended')AU.ctx.resume();AU.on=!AU.on;audioStop();AU.sched=rawT;ui();};
bLoop.onclick=()=>{loop=!loop;ui();};
let dragging=false;
const scrubTo=e=>{const r=scrub.getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width)*DUR);};
scrub.addEventListener('pointerdown',e=>{dragging=true;scrub.setPointerCapture(e.pointerId);scrubTo(e);});
scrub.addEventListener('pointermove',e=>{if(dragging)scrubTo(e);});
scrub.addEventListener('pointerup',()=>{dragging=false;});
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='BUTTON'&&(e.code==='Space'||e.key==='Enter'))return;
  if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}
  else if(e.key==='r'||e.key==='R'){seek(0);setPlaying(true);}
  else if(e.key==='m'||e.key==='M')bSound.onclick();
  else if(e.key==='l'||e.key==='L')bLoop.onclick();
  else if(e.key==='ArrowRight')seek(rawT+(e.shiftKey?1/FPS:5));
  else if(e.key==='ArrowLeft')seek(rawT-(e.shiftKey?1/FPS:5));
});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform='translate('+((innerWidth-W*s)/2)+'px,'+((innerHeight-H*s)/2)+'px) scale('+s+')';}
addEventListener('resize',fit);fit();
window.CHAKRA={seek:t=>{seek(t);render(rawT,0);},play:()=>setPlaying(true),pause:()=>setPlaying(false),get t(){return rawT;},DUR,scenes:SC.map(s=>({start:s.start,hi:s.hi,en:s.en}))};
// #t=42.5 opens paused on that frame; #t=42.5&play starts there
const hm=/t=([\d.]+)/.exec(location.hash);
if(hm){seek(parseFloat(hm[1]));render(rawT,0);if(/play/.test(location.hash))setPlaying(true);else ui();}
else setPlaying(true);
lastNow=performance.now();
requestAnimationFrame(frameLoop);
})();
</script>
